name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Smart Contracts Build, TypeCheck & 71-Test Suite
  # -------------------------------------------------------------
  smart-contracts:
    name: Contracts (Compile, Types & 71 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Compile Solidity Smart Contracts
        run: npx hardhat compile

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Complete Test Suite (71 Tests)
        run: npx hardhat test

  # -------------------------------------------------------------
  # Job 2: Indexer Service TypeCheck & Build
  # -------------------------------------------------------------
  indexer-service:
    name: Indexer (TypeCheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: indexer/package-lock.json

      - name: Install indexer dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Build Indexer
        run: npm run build

  # -------------------------------------------------------------
  # Job 3: Next.js Frontend TypeCheck & Production Build
  # -------------------------------------------------------------
  frontend-app:
    name: Frontend (TypeCheck & Next.js Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Build Next.js Production App
        run: npm run build
        env:
          NEXT_PUBLIC_SEPOLIA_RPC: https://ethereum-sepolia-rpc.publicnode.com
          NEXT_PUBLIC_INDEXER_URL: https://carbonvault-indexer.onrender.com

  # -------------------------------------------------------------
  # Job 4: Security & Sensitive Keys Leak Audit
  # -------------------------------------------------------------
  security-audit:
    name: Security & Secret Leak Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no real private keys or .env files are tracked
        run: |
          echo "Auditing tracked repository files..."
          if git ls-files | grep -E "(^\.env$|\.env\.local$|\.pem$|\.key$)"; then
            echo "::error::Sensitive environment or key file committed!"
            exit 1
          fi
          echo "Secret check passed: No prohibited sensitive files tracked."
